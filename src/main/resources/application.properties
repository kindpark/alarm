spring.application.name=alarm
server.port=8084
spring.config.import=optional:classpath:application-secret.properties

spring.datasource.url=jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Instant(createdAt)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- RabbitMQ 접속 (API_SPEC 9.1) ----
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=sns
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# ---- JWT (API_SPEC 13.1) ----
jwt.secret=${JWT_SECRET}

rabbitmq.queue.name=notification.events