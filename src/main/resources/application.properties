spring.application.name=alarm
server.port=8084

# ---- DB (API_SPEC 13.4: 알림 서비스 전용 notification_db) ----
# 값은 환경변수로 받는다. ${이름:기본값} 형식이라 환경변수가 없으면 콜론 뒤 기본값을 쓴다.
# createDatabaseIfNotExist=true: notification_db 스키마가 없으면 처음 접속할 때 만든다 (계정에 권한이 있어야 함)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# 비밀번호는 기본값 없이 환경변수로만 받는다
spring.datasource.password=${DB_PASSWORD}

# ---- JPA ----
# 개발 중에는 엔티티를 보고 테이블을 만들거나 고친다. 운영에서는 validate 로 바꾸고 SQL 로 관리할 것
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Instant(createdAt)를 UTC 로 저장한다
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- RabbitMQ 접속 (API_SPEC 9.1) ----
# 접속 정보만 둔다. 리스너 재시도와 DLQ 설정은 3단계에서 직접 추가할 것
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ---- JWT (API_SPEC 13.1) ----
# User-Service(msa_login)의 jwt.secret 과 같은 값. 코드와 설정 파일에는 적지 않고 환경변수 JWT_SECRET 으로만 받는다
jwt.secret=${JWT_SECRET}
